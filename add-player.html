
<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPL Season 03 - Player Registration</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 12px;
      font-family: Arial, sans-serif;
      background: #10131b;
      color: #fff;
    }

    .container {
      max-width: 520px;
      margin: auto;
      background: #1b2130;
      padding: 22px;
      border-radius: 18px;
      border: 1px solid #343c50;
    }

    h1 {
      text-align: center;
      color: #ffd54a;
      font-size: 25px;
      margin: 0 0 6px;
    }

    .subtitle {
      text-align: center;
      color: #c4ccdc;
      margin: 0 0 22px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #424c63;
      background: #101521;
      color: white;
      font-size: 16px;
    }

    input[type="file"] {
      font-size: 14px;
      padding: 10px;
    }

    .photo-box {
      margin-top: 12px;
      text-align: center;
      padding: 12px;
      background: #111724;
      border: 1px dashed #66718b;
      border-radius: 12px;
    }

    #photoPreview {
      display: none;
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      margin: 10px auto 0;
      border: 2px solid #ffd54a;
    }

    .hint {
      color: #b6c0d3;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      margin-top: 22px;
      background: #ffd54a;
      color: #111;
      font-weight: bold;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 9px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .success {
      display: block !important;
      background: #123d2a;
      border: 1px solid #2d9965;
      color: #b8ffd8;
    }

    .error {
      display: block !important;
      background: #491c25;
      border: 1px solid #b74657;
      color: #ffd0d5;
    }

    .required {
      color: #ff8d8d;
    }

    footer {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #aeb7c8;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>KPL SEASON 03</h1>
    <p class="subtitle">PLAYER REGISTRATION</p>

    <form id="registrationForm">
      <label for="playerName">കളിക്കാരന്റെ പേര് <span class="required">*</span></label>
      <input id="playerName" name="playerName" type="text"
             placeholder="പൂർണ്ണ പേര് നൽകുക" required maxlength="100">

      <label for="mobile">മൊബൈൽ നമ്പർ <span class="required">*</span></label>
      <input id="mobile" name="mobile" type="tel"
             placeholder="മൊബൈൽ നമ്പർ" inputmode="tel"
             required maxlength="20">

      <label for="place">സ്ഥലം <span class="required">*</span></label>
      <input id="place" name="place" type="text"
             placeholder="നിങ്ങളുടെ സ്ഥലം" required maxlength="100">

      <label for="role">കളിക്കുന്ന സ്ഥാനം <span class="required">*</span></label>
      <select id="role" name="role" required>
        <option value="">തിരഞ്ഞെടുക്കുക</option>
        <option value="Batsman">Batsman</option>
        <option value="Bowler">Bowler</option>
        <option value="All-Rounder">All-Rounder</option>
        <option value="Wicket Keeper">Wicket Keeper</option>
      </select>

      <label for="battingStyle">ബാറ്റിങ് ശൈലി</label>
      <select id="battingStyle" name="battingStyle">
        <option value="">തിരഞ്ഞെടുക്കുക</option>
        <option value="Right Hand">Right Hand</option>
        <option value="Left Hand">Left Hand</option>
      </select>

      <label for="bowlingStyle">ബൗളിങ് ശൈലി</label>
      <select id="bowlingStyle" name="bowlingStyle">
        <option value="">തിരഞ്ഞെടുക്കുക</option>
        <option value="Right Arm Fast">Right Arm Fast</option>
        <option value="Right Arm Medium">Right Arm Medium</option>
        <option value="Right Arm Spin">Right Arm Spin</option>
        <option value="Left Arm Fast">Left Arm Fast</option>
        <option value="Left Arm Medium">Left Arm Medium</option>
        <option value="Left Arm Spin">Left Arm Spin</option>
        <option value="Does Not Bowl">Does Not Bowl</option>
      </select>

      <label for="photo">കളിക്കാരന്റെ ഫോട്ടോ</label>
      <div class="photo-box">
        <input id="photo" name="photo" type="file"
               accept="image/*">
        <p class="hint">
          മൊബൈൽ ഗാലറിയിൽ നിന്ന് ഫോട്ടോ തിരഞ്ഞെടുക്കാം.
          അയയ്ക്കുന്നതിന് മുമ്പ് ഫോട്ടോയുടെ വലുപ്പം കുറയ്ക്കും.
        </p>
        <img id="photoPreview" alt="തിരഞ്ഞെടുത്ത ഫോട്ടോയുടെ പ്രിവ്യൂ">
      </div>

      <button id="submitButton" type="submit">രജിസ്ട്രേഷൻ സമർപ്പിക്കുക</button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>

    <footer>© KPL Season 03 — Player Registration</footer>
  </main>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbydD5G_BHVGIZIkXSfVgXi4DeL8elCX4wZ1st5QEHUq7-MqvIozyyptgp1k_vIBBACR/exec";

    const form = document.getElementById("registrationForm");
    const photoInput = document.getElementById("photo");
    const preview = document.getElementById("photoPreview");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");

    let compressedPhoto = null;

    function showMessage(text, type) {
      message.className = type;
      message.textContent = text;
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) {
          reject(new Error("ദയവായി ശരിയായ ഫോട്ടോ തിരഞ്ഞെടുക്കുക."));
          return;
        }

        const reader = new FileReader();

        reader.onerror = () => reject(
          new Error("ഫോട്ടോ വായിക്കാൻ കഴിഞ്ഞില്ല. മറ്റൊരു ഫോട്ടോ തിരഞ്ഞെടുക്കുക.")
        );

        reader.onload = () => {
          const image = new Image();

          image.onerror = () => reject(
            new Error("ഈ ഫോട്ടോ തുറക്കാൻ കഴിഞ്ഞില്ല. JPG അല്ലെങ്കിൽ PNG ഫോട്ടോ ഉപയോഗിക്കുക.")
          );

          image.onload = () => {
            const maxDimension = 1000;
            const scale = Math.min(
              1,
              maxDimension / Math.max(image.width, image.height)
            );

            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));

            const context = canvas.getContext("2d");
            context.fillStyle = "#ffffff";
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(image, 0, 0, canvas.width, canvas.height);

            let quality = 0.78;

            function makeSmaller() {
              canvas.toBlob(blob => {
                if (!blob) {
                  reject(new Error("ഫോട്ടോ തയ്യാറാക്കാൻ കഴിഞ്ഞില്ല."));
                  return;
                }

                if (blob.size > 450000 && quality > 0.35) {
                  quality -= 0.12;
                  makeSmaller();
                  return;
                }

                if (blob.size > 500000) {
                  reject(new Error(
                    "ഫോട്ടോയുടെ വലുപ്പം കുറയ്ക്കാൻ കഴിഞ്ഞില്ല. മറ്റൊരു ഫോട്ടോ തിരഞ്ഞെടുക്കുക."
                  ));
                  return;
                }

                const outputReader = new FileReader();

                outputReader.onerror = () => reject(
                  new Error("ഫോട്ടോ തയ്യാറാക്കുന്നതിൽ പിഴവ് സംഭവിച്ചു.")
                );

                outputReader.onload = () => {
                  const dataUrl = outputReader.result;
                  const base64 = String(dataUrl).split(",")[1];

                  resolve({
                    photoBase64: base64,
                    photoMimeType: "image/jpeg",
                    previewUrl: dataUrl
                  });
                };

                outputReader.readAsDataURL(blob);
              }, "image/jpeg", quality);
            }

            makeSmaller();
          };

          image.src = reader.result;
        };

        reader.readAsDataURL(file);
      });
    }

    photoInput.addEventListener("change", async () => {
      compressedPhoto = null;
      preview.style.display = "none";

      const file = photoInput.files && photoInput.files[0];
      if (!file) return;

      try {
        showMessage("ഫോട്ടോ തയ്യാറാക്കുന്നു...", "success");
        compressedPhoto = await compressImage(file);
        preview.src = compressedPhoto.previewUrl;
        preview.style.display = "block";
        showMessage("ഫോട്ടോ തയ്യാറായി. ഇനി ഫോം സമർപ്പിക്കാം.", "success");
      } catch (error) {
        photoInput.value = "";
        showMessage(error.message || "ഫോട്ടോയിൽ പിഴവ് സംഭവിച്ചു.", "error");
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!form.reportValidity()) return;

      submitButton.disabled = true;
      submitButton.textContent = "സമർപ്പിക്കുന്നു...";
      message.className = "";
      message.style.display = "block";
      message.textContent = "രജിസ്ട്രേഷൻ സമർപ്പിക്കുന്നു. ദയവായി കാത്തിരിക്കുക...";

      try {
        if (photoInput.files.length && !compressedPhoto) {
          compressedPhoto = await compressImage(photoInput.files[0]);
        }

        const payload = {
          action: "addPlayer",
          playerName: document.getElementById("playerName").value.trim(),
          mobile: document.getElementById("mobile").value.trim(),
          place: document.getElementById("place").value.trim(),
          role: document.getElementById("role").value,
          battingStyle: document.getElementById("battingStyle").value,
          bowlingStyle: document.getElementById("bowlingStyle").value,
          photoBase64: compressedPhoto ? compressedPhoto.photoBase64 : "",
          photoMimeType: compressedPhoto ? compressedPhoto.photoMimeType : ""
        };

        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload),
          redirect: "follow"
        });

        const result = await response.json();

        if (!response.ok || result.success === false || result.error) {
          throw new Error(
            result.message || result.error || "രജിസ്ട്രേഷൻ വിജയിച്ചില്ല."
          );
        }

        const registrationNumber =
          result.registrationNumber ||
          result.regNumber ||
          result.data?.registrationNumber ||
          "";

        form.reset();
        compressedPhoto = null;
        preview.removeAttribute("src");
        preview.style.display = "none";

        showMessage(
          "രജിസ്ട്രേഷൻ വിജയകരമായി സമർപ്പിച്ചു!" +
          (registrationNumber
            ? " രജിസ്ട്രേഷൻ നമ്പർ: " + registrationNumber
            : "") +
          " നിങ്ങളുടെ വിവരങ്ങൾ പരിശോധിക്കുക.",
          "success"
        );
      } catch (error) {
        showMessage(
          "രജിസ്ട്രേഷൻ സമർപ്പിക്കാൻ കഴിഞ്ഞില്ല: " +
          (error.message || "നെറ്റ്‌വർക്ക് അല്ലെങ്കിൽ API പ്രശ്നം.") +
          " വീണ്ടും ശ്രമിക്കുക.",
          "error"
        );
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "രജിസ്ട്രേഷൻ സമർപ്പിക്കുക";
      }
    });
  </script>
</body>
</html>
